<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300" fill="none">
  <defs>
    <radialGradient id="glow1" cx="75%" cy="25%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="30%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d121b"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
  </defs>
  <rect width="800" height="300" fill="url(#bg)"/>
  <rect width="800" height="300" fill="url(#glow1)"/>
  <rect width="800" height="300" fill="url(#glow2)"/>

  <!-- Phone icon -->
  <g transform="translate(480, 60)">
    <rect x="0" y="0" width="72" height="130" rx="14" fill="#1a2538" stroke="#22d3ee" stroke-width="2"/>
    <circle cx="36" cy="114" r="5" fill="none" stroke="#22d3ee" stroke-width="1.5"/>
    <rect x="28" y="12" width="16" height="3" rx="1.5" fill="#22d3ee" opacity="0.6"/>

    <!-- Waveform bars inside phone -->
    <g fill="#22d3ee" opacity="0.85">
      <rect x="16" y="50" width="4" height="24" rx="2"/>
      <rect x="24" y="40" width="4" height="44" rx="2"/>
      <rect x="32" y="34" width="4" height="56" rx="2"/>
      <rect x="40" y="42" width="4" height="40" rx="2"/>
      <rect x="48" y="52" width="4" height="20" rx="2"/>
      <rect x="56" y="44" width="4" height="36" rx="2"/>
    </g>
  </g>

  <!-- Checkmark badge -->
  <circle cx="564" cy="78" r="22" fill="#22c55e" opacity="0.9"/>
  <path d="M554 78 L561 85 L576 70" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Chat bubble -->
  <g transform="translate(580, 110)">
    <rect x="0" y="0" width="120" height="60" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <polygon points="20,60 10,76 34,60" fill="#1e293b" stroke="#334155" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="20" y="60" width="14" height="2" fill="#1e293b"/>
    <text x="60" y="28" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" font-weight="600">Order Confirmed</text>
    <text x="60" y="44" fill="#22c55e" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">COD Verified</text>
  </g>

  <!-- Text -->
  <text x="40" y="130" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5">Breeze Buddy</text>
  <text x="40" y="165" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="15" font-weight="500">Automated COD Verification via Voice AI</text>

  <!-- Feature chips -->
  <g transform="translate(40, 195)">
    <rect x="0" y="0" width="160" height="28" rx="6" fill="#0f172a" stroke="#22d3ee" stroke-width="1" opacity="0.8"/>
    <text x="12" y="18" fill="#22d3ee" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Language Detection</text>

    <rect x="176" y="0" width="190" height="28" rx="6" fill="#0f172a" stroke="#8b5cf6" stroke-width="1" opacity="0.8"/>
    <text x="188" y="18" fill="#8b5cf6" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Smart Retry Scheduling</text>

    <rect x="382" y="0" width="200" height="28" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1" opacity="0.8"/>
    <text x="394" y="18" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Address Capture &amp; Update</text>
  </g>
</svg>
